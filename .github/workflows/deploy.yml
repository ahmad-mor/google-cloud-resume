name: Deploy Cloud Resume to GCP Cloud Run

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: pip install -r Backend/requirements.txt pytest ruff

    - name: Check backend code for errors
      run: ruff check Backend --select E9,F63,F7,F82

    - name: Run unit tests
      run: pytest Backend -v

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Deploy Backend API (Python function) to Cloud Run
      run: |
        gcloud run deploy visitor-counter-api \
          --source Backend \
          --function hello_http \
          --base-image python312 \
          --region europe-west1 \
          --project cloud-resume-project-504113 \
          --allow-unauthenticated \
          --quiet

    - name: Build and Deploy Frontend to Cloud Run
      run: |
        gcloud run deploy cloud-resume \
          --source . \
          --region europe-west1 \
          --project cloud-resume-project-504113 \
          --allow-unauthenticated \
          --quiet